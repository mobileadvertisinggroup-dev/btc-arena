# AKRA ARENA — direct read-only publication endpoint (Mentor Ruling 1).
# Serves ONLY the live payload, its checksum, and health. GET/HEAD only —
# no endpoint accepts commands, prompts, credentials, or state changes.
# TLS: use certbot --nginx after DNS points at the VPS; this file assumes
# the certbot-managed 443 server block wraps or includes it.
server {
    listen 80;
    listen [::]:80;
    server_name ARENA_VPS_HOST;   # <- replace with the owner's domain

    root /var/www/arena;

    # nothing else in the tree is ever served
    location / { return 404; }

    location ~ ^/(live_payload\.js|live_payload\.sha256|health\.json)$ {
        limit_except GET { deny all; }
        add_header Access-Control-Allow-Origin "*" always;   # dashboard on Pages reads this
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
