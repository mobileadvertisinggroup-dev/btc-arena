<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Arena — Raw vs Feature (Preparation)</title>
<style>
:root {
  --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e;
  --muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,.10);
  --haiku:#2a78d6; --sonnet:#1baf7a; --opus:#eda100;
  --up:#006300; --down:#d03b3b; --warn:#fab219;
}
@media (prefers-color-scheme: dark) { :root {
  --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
  --muted:#898781; --grid:#2c2c2a; --border:rgba(255,255,255,.10);
  --haiku:#3987e5; --sonnet:#199e70; --opus:#c98500;
  --up:#0ca30c; --down:#e66767;
}}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  max-width:1160px;margin:0 auto;padding:18px}
.banner{background:var(--warn);color:#0b0b0b;font-weight:700;text-align:center;
  padding:10px 14px;border-radius:10px;margin-bottom:6px}
.subnotice{color:var(--ink2);font-size:12.5px;text-align:center;margin-bottom:14px}
header{display:flex;justify-content:space-between;align-items:baseline;
  flex-wrap:wrap;gap:8px;margin-bottom:6px}
h1{font-size:20px;font-weight:650}
nav a{color:var(--ink2);margin-left:14px;font-size:13px}
.q{color:var(--ink2);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:6px 16px;cursor:pointer;font-weight:600;color:var(--ink2)}
.tab.active{color:var(--ink);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:650;margin-bottom:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
.acct{background:var(--page);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:12.5px}
.acct .head{display:flex;justify-content:space-between;align-items:baseline}
.acct .name{font-weight:650;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.eq{font-size:19px;font-weight:650;margin:4px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.thesis{margin-top:6px;border-top:1px solid var(--grid);padding-top:6px}
.inv{color:var(--muted);font-size:12px;margin-top:4px}
.up{color:var(--up)} .down{color:var(--down)}
.delta{color:var(--ink2);font-size:12.5px;margin:-6px 0 12px 2px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:500;padding:4px 10px 4px 0;
  border-bottom:1px solid var(--grid)}
td{padding:4px 10px 4px 0;border-bottom:1px solid var(--grid);
  font-variant-numeric:tabular-nums;vertical-align:top}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{background:var(--page);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px}
.stat .l{color:var(--muted);font-size:12px}
.stat .v{font-weight:650}
footer{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="banner">NEW BTC ARENA — PREPARATION MODE — EXPERIMENT NOT STARTED</div>
<div class="subnotice" id="notice"></div>
<header>
  <h1>&#8383; BTC Arena — Raw vs Feature</h1>
  <nav>
    <a href="pilot-archive/">Pilot Archive</a>
    <a href="design/DESIGN_PACK_V1_1.md">Design Pack</a>
  </nav>
</header>
<div class="q" id="question"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<footer id="foot"></footer>
<script src="demo_payload.js"></script>
<script>
const D = window.ARENA_DATA;
const MODELCOLOR = {haiku:'var(--haiku)', sonnet:'var(--sonnet)', opus:'var(--opus)'};
const MODELNAME = {haiku:'Haiku 4.5', sonnet:'Sonnet 5', opus:'Opus 4.8'};
const $ = s => document.getElementById(s);
const money = v => '$' + Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const px = v => v == null ? 'none' : Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
$('notice').textContent = D.data_notice;
$('question').textContent = D.question;

function acctCard(a){
  const pnl = Number(a.total_return_pct);
  const upnl = Number(a.unrealized_pnl);
  const realized = Number(a.realized_pnl);
  const inv = a.invalidation;
  const pos = a.side === 'flat' ? 'FLAT — no position'
    : `${a.side.toUpperCase()} ${a.qty} (${money(a.notional)})`;
  return `<div class="acct">
    <div class="head"><span class="name"><span class="dot" style="background:${MODELCOLOR[a.model]}"></span>
      ${MODELNAME[a.model]} · ${a.arm === 'raw' ? 'Raw' : 'Feature'}</span>
      <span class="${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}%</span></div>
    <div class="eq">${money(a.equity)}</div>
    <div class="kv">
      <span>Position</span><b>${pos}</b>
      <span>Entry</span><b>${px(a.entry)}</b>
      <span>Stop-loss</span><b>${px(a.stop)}</b>
      <span>Take-profit</span><b>${px(a.tp)}</b>
      <span>Unrealized P&amp;L</span><b class="${upnl >= 0 ? 'up' : 'down'}">${money(a.unrealized_pnl)}</b>
      <span>Realized P&amp;L</span><b class="${realized >= 0 ? 'up' : 'down'}">${money(a.realized_pnl)}</b>
      <span>Fees</span><b>${money(a.fees)}</b>
      <span>Decisions / trades</span><b>${a.n_decisions} / ${a.n_trades}</b>
    </div>
    ${a.thesis ? `<div class="thesis"><b>Latest thesis:</b> ${a.thesis.replace(/</g,'&lt;')}</div>` : ''}
    ${inv ? `<div class="inv">Invalidation: ${a.coin} ${inv.timeframe === '1h_close' ? '1h close' : 'price trades'} ${inv.operator === 'price_at_or_below' ? 'at or below' : 'at or above'} ${px(inv.level)} — ${inv.status}</div>` : ''}
    ${a.watch ? `<div class="inv">Watch (informational): 1h close ${a.watch.operator === 'price_at_or_below' ? 'at or below' : 'at or above'} ${px(a.watch.level)}${a.watch.triggered ? ' — TRIGGERED' : ''}</div>` : ''}
    ${a.trades.length ? `<div class="inv">Trades: ${a.trades.map(t => `${t.side} ${px(t.entry)}&rarr;${px(t.exit)} (${Number(t.pnl) >= 0 ? '+' : ''}${Number(t.pnl).toFixed(2)}, ${t.reason.replace(/_/g,' ')})`).join(' · ')}</div>` : ''}
  </div>`;
}

function coinView(coin){
  const cd = D.coins[coin];
  const byId = {}; cd.accounts.forEach(a => byId[a.id] = a);
  let html = '';
  for (const m of ['haiku','sonnet','opus']){
    const raw = byId[`${coin.toLowerCase()}_${m}_raw`];
    const ta = byId[`${coin.toLowerCase()}_${m}_ta`];
    const agree = raw.side === ta.side;
    html += `<div class="card"><h2><span class="dot" style="background:${MODELCOLOR[m]};display:inline-block;margin-right:6px"></span>${MODELNAME[m]} — ${coin} pair</h2>
      <div class="delta">Direction: ${agree ? 'agree' : 'DISAGREE'} (Raw ${raw.side} vs Feature ${ta.side}) ·
        equity gap ${money(Number(raw.equity) - Number(ta.equity))}</div>
      <div class="pair">${acctCard(raw)}${acctCard(ta)}</div></div>`;
  }
  const rounds = cd.rounds.filter(r => r.status);
  html += `<div class="card"><h2>${coin} round ledger</h2><div class="tablewrap"><table>
    <tr><th>Round</th><th>Pair</th><th>Status</th><th>Reason</th></tr>
    ${rounds.map(r => `<tr><td>${r.round_id}</td><td>${r.pair}</td><td>${r.status}</td><td>${r.reason || ''}</td></tr>`).join('')}
    </table></div></div>`;
  return html;
}

function aggregateView(){
  let rows = '';
  for (const coin of ['BTC','ETH','SOL'])
    for (const a of D.coins[coin].accounts)
      rows += `<tr><td>${coin}</td><td><span class="dot" style="background:${MODELCOLOR[a.model]};display:inline-block;margin-right:5px"></span>${MODELNAME[a.model]}</td>
        <td>${a.arm === 'raw' ? 'Raw' : 'Feature'}</td><td>${money(a.equity)}</td>
        <td class="${Number(a.total_return_pct) >= 0 ? 'up' : 'down'}">${Number(a.total_return_pct).toFixed(2)}%</td>
        <td>${a.side}</td><td>${a.side === 'flat' ? '—' : money(a.notional)}</td>
        <td>${money(a.fees)}</td><td>${a.terminal ? '&#128128;' : 'active'}</td></tr>`;
  const rc = D.round_counts;
  return `<div class="card"><h2>Experiment / system status</h2><div class="statusgrid">
      <div class="stat"><div class="l">Mode</div><div class="v">${D.mode}</div></div>
      <div class="stat"><div class="l">Committed pairs</div><div class="v">${rc.PAIR_COMMITTED || 0}</div></div>
      <div class="stat"><div class="l">Aborted pairs</div><div class="v">${rc.PAIR_ABORTED || 0}</div></div>
      <div class="stat"><div class="l">Terminal splits</div><div class="v">${rc.PAIR_TERMINAL_SPLIT || 0}</div></div>
      <div class="stat"><div class="l">Integrity hash</div><div class="v" style="font-size:11px">${D.combined_hash.slice(0,16)}…</div></div>
      <div class="stat"><div class="l">Heartbeat</div><div class="v">${D.health.stale ? 'STALE' : 'ok'}</div></div>
    </div></div>
    <div class="card"><h2>All 18 accounts (grouped by coin — never summed across coins)</h2>
    <div class="tablewrap"><table><tr><th>Coin</th><th>Model</th><th>Arm</th><th>Balance</th>
      <th>Return</th><th>Side</th><th>Size</th><th>Fees</th><th>Status</th></tr>${rows}</table></div></div>`;
}

const TABS = ['Aggregate','BTC','ETH','SOL'];
let active = 'Aggregate';
function render(){
  $('tabs').innerHTML = TABS.map(t =>
    `<div class="tab ${t === active ? 'active' : ''}" onclick="setTab('${t}')">${t}</div>`).join('');
  $('view').innerHTML = active === 'Aggregate' ? aggregateView() : coinView(active);
  $('foot').textContent = `${D.label} · payload generated offline — mock/demo data only`;
}
window.setTab = t => { active = t; render(); };
render();
</script>
</body>
</html>
